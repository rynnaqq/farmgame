# Builds the Garden Island 3D Android APK and publishes a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces a debuggable APK for sideloading (no signing key required).
# Play Store (signed AAB) is a separate future step needing keystore secrets.
name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 / AGP requires JDK 21 (17 fails with
          # "invalid source release: 21" in compileDebugJavaWithJavac).
          java-version: 21
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Configure Supabase env (verdant APK with login)
        # Vite bakes VITE_* into the bundle at build time, and .env is
        # gitignored, so CI must reconstruct it from repository secrets.
        # Without secrets the build falls back to local (guest) mode.
        # Required secrets (repo Settings -> Secrets -> Actions):
        #   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
        run: |
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            printf 'VITE_GAME_MODE=verdant\nVITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' \
              "${{ secrets.VITE_SUPABASE_URL }}" \
              "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" > .env
            echo "Supabase env configured (verdant mode with login)"
          else
            echo "No Supabase secrets found; building in local mode"
          fi

      - name: Verify web build (lint + typecheck + tests)
        run: |
          npx tsc --noEmit
          npx eslint src tests
          npx vitest run

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with tag
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "garden-island-3d-${GITHUB_REF_NAME}.apk"
          ls -la garden-island-3d-*.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Garden Island 3D ${GITHUB_REF_NAME}" \
            --generate-notes \
            "garden-island-3d-${GITHUB_REF_NAME}.apk"
